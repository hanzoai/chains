name: Docker (VM plugins)
on:
  workflow_dispatch:
  push:
    branches: [main, dev, test]
    tags: ['v*']

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build:
    strategy:
      matrix:
        vm: [evm, dexvm, aivm, bridgevm, graphvm, identityvm, keyvm, oraclevm, quantumvm, relayvm, servicenodevm, teleportvm, thresholdvm, zkvm, hanzo-evm]
      fail-fast: false
    runs-on: [self-hosted, linux, amd64]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: ${{ matrix.vm }}/go.sum
      - name: Build amd64
        working-directory: ${{ matrix.vm }}
        env:
          GONOSUMCHECK: github.com/luxfi/*
          GONOSUMDB: github.com/luxfi/*
          CGO_ENABLED: ${{ matrix.vm == 'evm' && '1' || '0' }}
          CGO_CFLAGS: ${{ matrix.vm == 'evm' && '-O2 -D__BLST_PORTABLE__' || '' }}
        run: |
          go mod tidy
          mkdir -p ../build/amd64
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o ../build/amd64/${{ matrix.vm }} .
      - name: Build arm64
        working-directory: ${{ matrix.vm }}
        env:
          GONOSUMCHECK: github.com/luxfi/*
          GONOSUMDB: github.com/luxfi/*
          CGO_ENABLED: ${{ matrix.vm == 'evm' && '1' || '0' }}
          CGO_CFLAGS: ${{ matrix.vm == 'evm' && '-O2 -D__BLST_PORTABLE__' || '' }}
        run: |
          mkdir -p ../build/arm64
          GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o ../build/arm64/${{ matrix.vm }} .
      # ⛔ Held at v4 DELIBERATELY, and neither version works. Read before changing.
      #
      # v4 is refused by the forge, which presents as GHES:
      #   GHESNotSupportedError: @actions/artifact v2.0.0+, upload-artifact@v4+
      #   and download-artifact@v4+ are not currently supported on GHES.
      # So no artifact is ever produced. v3 is the version that CAN work — bot
      # has green runs on it.
      #
      # But switching this to v3 made things WORSE here, for a reason that has
      # nothing to do with the version. The forge resolves actions against an
      # empty default URL:
      #   git clone 'https:///actions/upload-artifact'  ->  no Host in request URL
      # so a runner can only use actions already in its local act cache. v4 is
      # cached on these runners; v3 is not. Result: v4 fails at the LAST step
      # with every build green, while v3 fails BEFORE any step runs and you
      # cannot tell whether the code compiles at all.
      #
      # That build signal is load-bearing — it is what showed the go.sum repair
      # in b1dae5d had worked. Keeping v4 preserves it.
      #
      # The real fix is on the Gitea server: [actions] DEFAULT_ACTIONS_URL must
      # point at something real so runners can fetch actions they have not seen.
      # Move this to v3 in the same change that fixes that, not before.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.vm }}
          path: build/

  docker:
    needs: build
    if: github.event_name != 'pull_request'
    strategy:
      matrix:
        vm: [evm, dexvm, aivm, bridgevm, graphvm, identityvm, keyvm, oraclevm, quantumvm, relayvm, servicenodevm, teleportvm, thresholdvm, zkvm, hanzo-evm]
      fail-fast: false
    uses: hanzoai/.github/.github/workflows/docker-build.yml@main
    with:
      image: ghcr.io/hanzoai/chains/${{ matrix.vm }}
      pre-build-command: |
        gh run download ${{ github.run_id }} -n ${{ matrix.vm }} -D . || true
        ls -la build/
        cat > Dockerfile.plugin <<EOF
        FROM scratch
        ARG TARGETARCH
        COPY build/\${TARGETARCH}/${{ matrix.vm }} /plugin
        ENTRYPOINT ["/plugin"]
        EOF
      dockerfile: Dockerfile.plugin
    secrets: inherit
