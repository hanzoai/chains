name: Docker (VM plugins)
on:
  workflow_dispatch:
  push:
    branches: [main, dev, test]
    tags: ['v*']

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build:
    strategy:
      matrix:
        vm: [evm, dexvm, aivm, bridgevm, graphvm, identityvm, keyvm, oraclevm, quantumvm, relayvm, servicenodevm, teleportvm, thresholdvm, zkvm, hanzo-evm]
      fail-fast: false
    runs-on: [self-hosted, linux, amd64]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: ${{ matrix.vm }}/go.sum
      - name: Build amd64
        working-directory: ${{ matrix.vm }}
        env:
          GONOSUMCHECK: github.com/luxfi/*
          GONOSUMDB: github.com/luxfi/*
          CGO_ENABLED: ${{ matrix.vm == 'evm' && '1' || '0' }}
          CGO_CFLAGS: ${{ matrix.vm == 'evm' && '-O2 -D__BLST_PORTABLE__' || '' }}
        run: |
          go mod tidy
          mkdir -p ../build/amd64
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o ../build/amd64/${{ matrix.vm }} .
      # Skipped for evm, the only VM that needs CGO. A CGO arm64 build needs an
      # aarch64 cross-toolchain, and the job image (catthehacker/ubuntu:act-24.04)
      # has none, so the host x86 assembler is handed arm64 assembly:
      #
      #   gcc_arm64.S:59: Error: no such instruction: `ldp x27,x28,[sp,'
      #
      # The other 14 VMs build CGO_ENABLED=0 and cross-compile in pure Go, so
      # they are unaffected and keep producing arm64 binaries.
      #
      # Not worth adding a cross-toolchain for: the estate is amd64-only. arm64
      # has been paused since 2026-04-27 because DOKS offers no arm64 droplets
      # (see hanzo/CLAUDE.md), so this step was failing the whole job to produce
      # a binary nothing deploys.
      - name: Build arm64
        if: matrix.vm != 'evm'
        working-directory: ${{ matrix.vm }}
        env:
          GONOSUMCHECK: github.com/luxfi/*
          GONOSUMDB: github.com/luxfi/*
          CGO_ENABLED: ${{ matrix.vm == 'evm' && '1' || '0' }}
          CGO_CFLAGS: ${{ matrix.vm == 'evm' && '-O2 -D__BLST_PORTABLE__' || '' }}
        run: |
          mkdir -p ../build/arm64
          GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o ../build/arm64/${{ matrix.vm }} .
      # v3, not v4. The forge presents as GHES and v4 refuses outright:
      #   GHESNotSupportedError: @actions/artifact v2.0.0+, upload-artifact@v4+
      #   and download-artifact@v4+ are not currently supported on GHES.
      # So on v4 every VM in this matrix compiled its binary and then discarded
      # it at this step, and the job reported "failed" with the build green.
      #
      # This was briefly reverted to v4 on purpose. At the time the runners
      # could not FETCH an uncached action at all — they resolved every `uses:`
      # against an empty host — so switching to an uncached v3 made the job die
      # before any step ran, destroying the build signal. That is fixed:
      # git-runner 0.6.1-hanzo.4972baa falls back to https://github.com instead
      # of "", verified with 0 cached actions on the runners and 7/0
      # success/failure after the roll. v3 can now be fetched on demand.
      - uses: actions/upload-artifact@v3
        with:
          name: ${{ matrix.vm }}
          path: build/

  # NOT `uses:` — this forge does not expand a reusable workflow invoked from a
  # MATRIX. Measured against a working caller: hanzoai/team calls the same
  # reusable from a PLAIN job and the forge creates the caller stub plus the
  # expanded jobs (build-amd64 ran, 8 steps). From this matrix it created only
  # the 15 `docker (vm)` stubs — zero expanded jobs, steps=0 — and the log
  # endpoint answers {"message":"job not started"}: never handed to a runner.
  # All 15 legs failed that way on every run while the build half was green.
  #
  # Naming runner-amd64 explicitly did NOT help, so it is not an unapplied
  # input default. The matrix is the trigger, so the build is inlined. Nothing
  # of the reusable is lost here: this is a scratch image over an already-built
  # binary, so none of its multi-arch, cache or SBOM machinery applies.
  docker:
    needs: build
    if: github.event_name != 'pull_request'
    strategy:
      matrix:
        vm: [evm, dexvm, aivm, bridgevm, graphvm, identityvm, keyvm, oraclevm, quantumvm, relayvm, servicenodevm, teleportvm, thresholdvm, zkvm, hanzo-evm]
      fail-fast: false
    runs-on: [hanzo-build-linux-amd64]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # v3: the forge presents as GHES and refuses download-artifact@v4+,
      # exactly as the upload above does.
      - uses: actions/download-artifact@v3
        with:
          name: ${{ matrix.vm }}
          path: build
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
      - name: Build and push
        run: |
          set -euo pipefail
          IMG="ghcr.io/hanzoai/chains/${{ matrix.vm }}"
          # Semver-only: a v* tag publishes that version, any other push
          # publishes an immutable sha-<sha7>. Never a floating tag.
          case "${GITHUB_REF}" in
            refs/tags/v*) TAG="${GITHUB_REF#refs/tags/}" ;;
            *)            TAG="sha-$(echo "${GITHUB_SHA}" | cut -c1-7)" ;;
          esac
          # amd64 only: arm64 is paused estate-wide (DOKS ships no arm64), and
          # the build job above already skips the arm64 leg for evm.
          cp "build/amd64/${{ matrix.vm }}" plugin
          cat > Dockerfile.plugin <<'EOF'
          FROM scratch
          COPY plugin /plugin
          ENTRYPOINT ["/plugin"]
          EOF
          docker build -f Dockerfile.plugin -t "${IMG}:${TAG}" .
          docker push "${IMG}:${TAG}"
          echo "pushed ${IMG}:${TAG}"
